[package]
name = "librarian"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
bm25 = "2.3"
regex = "1.13.2"
rig-agent = "0.46"
rig-core = { version = "0.46", features = ["reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "time", "signal"] }

[dev-dependencies]
rig-core = { version = "0.46", features = ["test-utils"] }
